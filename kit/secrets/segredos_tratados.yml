# Achados históricos de forma de credencial já tratados. O veredito de
# `secrets_review.py --historico` é "nada não tratado", nunca "nada encontrado":
# o que entrou no histórico fica lá, e reescrever o histórico é decisão do Owner.
# Cada entrada é (commit, caminho, chave), com o tratamento e o motivo.
tratados: []
#  - commit: <sha completo>
#    caminho: <arquivo>
#    chave: <chave acusada>
#    tratamento: rotacionada | falso positivo | molde
#    motivo: <por quê>
